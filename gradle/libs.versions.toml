# Central dependency catalog. Bump versions here only.
[versions]
agp = "9.5.1"
junit = "4.13.2"
robolectric = "4.18"
truth = "1.4.5"
androidx-core = "1.19.1"
androidx-activity = "1.13.0"
androidx-window = "1.5.1"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-test-rules = "1.7.0"
androidx-test-ext = "1.3.0"
espresso = "3.7.0"
uiautomator = "2.4.1"
billing = "9.1.0"
profileinstaller = "1.4.1"
orgjson = "20260814"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

orgjson = { module = "org.json:json", version.ref = "orgjson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
