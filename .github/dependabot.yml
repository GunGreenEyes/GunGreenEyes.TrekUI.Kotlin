# Keeps every dependency current without anyone remembering to check (LCA-T41, docs/PLATFORM_UPDATES.md).
# Each update arrives as a pull request; CI (Develop) builds and tests it, and the local upgrade queue
# (scripts/maintenance/queue-upgrades.ps1) turns it into a ticket. New Android API levels and Gradle releases
# are watched separately by .github/workflows/platform-watch.yml.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels: [dependencies, platform-upgrade]
    groups:
      # First matching group wins, so the narrow groups come before the broad ones.
      play-billing:
        patterns: ["com.android.billingclient*"]
      test-libraries:
        patterns: ["junit*", "org.robolectric*", "com.google.truth*", "androidx.test*"]
      android-gradle-plugin:
        patterns: ["com.android.*"]
      androidx:
        patterns: ["androidx.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels: [dependencies, github_actions]
    groups:
      actions:
        patterns: ["*"]
